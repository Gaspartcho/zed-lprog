name = "Lambda Prog"
grammar = "lprog"
path_suffixes = ["lp"]
line_comments = ["%%"]
tab_size = 2
brackets = [
	{ start = "%", end = "%", close = true, newline = false},
	{ start = "(", end = ")", close = true, newline = false},
  	{ start = "[", end = "]", close = true, newline = false},
  # other pairs...
]
